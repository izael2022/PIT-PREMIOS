name: Testes de integridade do PIT PRÊMIOS

on:
  push:
    branches: ["main", "audit/**", "improvement/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Atualizar pip
        run: python -m pip install --upgrade pip
      - name: Instalar dependências de produção
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q .
      - name: Executar testes automatizados
        env:
          BOT_TOKEN: "123456:test-token"
          ADMIN_IDS: "1"
          BACKUP_ENCRYPTION_KEY: "cGl0LXByZW1pb3MtdGVzdC1rZXktMzItYnl0ZXMhIQ=="
          DATABASE_PATH: "${{ runner.temp }}/pit-premios-ci.db"
        run: python -m unittest discover -s tests -v
      - name: Teste isolado de estabilidade SQLite
        run: python scripts/sqlite_load_test.py --workers 4 --writes 250
