name: Executor alternativo - Diagnostico PIT PREMIOS

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pit-premios-diagnostico-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnostico:
    name: Diagnostico Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Baixar codigo do PR
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m compileall -q .

      - name: Executar testes e salvar log completo
        env:
          BOT_TOKEN: "123456:test-token"
          ADMIN_IDS: "1"
          BACKUP_ENCRYPTION_KEY: "cGl0LXByZW1pb3MtdGVzdC1rZXktMzItYnl0ZXMhISE="
          DATABASE_PATH: "${{ runner.temp }}/pit-premios-diagnostico.db"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.log

      - name: Teste de carga SQLite
        if: success()
        run: python scripts/sqlite_load_test.py --workers 4 --writes 250

      - name: Publicar log dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-testes-python-${{ matrix.python-version }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7
