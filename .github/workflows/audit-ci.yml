name: PIT Premios Audit CI

on:
  push:
    branches:
      - auditoria-correcao-integral-pit-premios
  pull_request:
    branches:
      - auditoria-correcao-integral-pit-premios
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit dependency vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run isolated database tests
        env:
          BOT_TOKEN: test-token-not-valid
          ADMIN_IDS: 123456789
        run: python -m unittest discover -s tests -v
      - name: Check critical files
        run: |
          test -f main.py
          test -f database.py
          test -f config.py
          test -f backup_utils.py
