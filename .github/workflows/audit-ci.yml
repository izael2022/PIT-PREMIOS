name: PIT Premios Audit CI

on:
  push:
    branches:
      - auditoria-correcao-integral-pit-premios
  pull_request:
    branches:
      - auditoria-correcao-integral-pit-premios
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Check critical files
        run: |
          test -f main.py
          test -f database.py
          test -f config.py
          test -f backup_utils.py
