name: Gerar pacote ZIP Discloud

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacote-discloud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Montar pacote sem banco de produção
        run: |
          mkdir -p /tmp/pit-package
          git archive HEAD | tar -x -C /tmp/pit-package
          rm -rf /tmp/pit-package/.git /tmp/pit-package/.github /tmp/pit-package/data
          find /tmp/pit-package -type f \( -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" \) -delete
          cd /tmp/pit-package
          zip -r "$GITHUB_WORKSPACE/PIT-PREMIOS-DISCloud.zip" .
      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PIT-PREMIOS-DISCloud
          path: PIT-PREMIOS-DISCloud.zip
          retention-days: 7
